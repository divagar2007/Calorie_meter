<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Tracker Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: linear-gradient(135deg,#0f172a,#1e293b,#020617);
    color:white;
    min-height:100vh;
    padding:30px;
    transition:0.4s;
}

body.light{
    background: linear-gradient(135deg,#f8fafc,#e2e8f0,#cbd5e1);
    color:black;
}

h1{
    text-align:center;
    font-size:38px;
    margin-bottom:30px;
    font-weight:700;
    background: linear-gradient(to right,#38bdf8,#818cf8);
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.toggle-btn{
    position:absolute;
    top:20px;
    right:30px;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    background:#38bdf8;
    color:white;
}

.dashboard{
    max-width:1300px;
    margin:auto;
}

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.summary-card,.card,.table-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    transition:0.3s;
}

body.light .summary-card,
body.light .card,
body.light .table-card{
    background:rgba(255,255,255,0.7);
    color:black;
}

.summary-card:hover{
    transform:translateY(-5px);
}

.summary-card h3{
    font-size:18px;
    color:#cbd5e1;
    margin-bottom:10px;
}

body.light .summary-card h3{
    color:#334155;
}

.summary-card p{
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-bottom:30px;
}

.card h2{
    margin-bottom:20px;
}

canvas{
    background:white;
    border-radius:15px;
    padding:15px;
}

#pieChart{
    max-width:300px !important;
    max-height:300px !important;
    margin:auto;
    display:block;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#334155;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.1);
}

body.light td{
    color:black;
}

tr:hover{
    background:rgba(255,255,255,0.05);
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<button class="toggle-btn" onclick="toggleTheme()">🌙 Toggle Mode</button>

<div class="dashboard">
    <h1>Calorie Tracker Dashboard</h1>

    <div class="summary">
        <div class="summary-card">
            <h3>Total Entries</h3>
            <p id="totalEntries">0</p>
        </div>

        <div class="summary-card">
            <h3>Total Calories</h3>
            <p id="totalCalories">0</p>
        </div>

        <div class="summary-card">
            <h3>Average Calories</h3>
            <p id="avgCalories">0</p>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Calorie Trend</h2>
            <canvas id="lineChart"></canvas>
        </div>

        <div class="card">
            <h2>Food Distribution</h2>
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="table-card">
        <h2>Food History</h2>
        <table id="historyTable">
            <tr>
                <th>Date</th>
                <th>Food</th>
                <th>Calories</th>
            </tr>
        </table>
    </div>
</div>

<script>
function toggleTheme(){
    document.body.classList.toggle("light");
}

fetch('history.json')
.then(response => response.json())
.then(data => {

    const labels = data.map(item => item.food);
    const calories = data.map(item => item.calories);

    const totalCalories = calories.reduce((a,b)=>a+b,0);
    const avgCalories = data.length ? (totalCalories/data.length).toFixed(1) : 0;

    document.getElementById("totalEntries").innerText = data.length;
    document.getElementById("totalCalories").innerText = totalCalories + " kcal";
    document.getElementById("avgCalories").innerText = avgCalories + " kcal";

    const table = document.getElementById("historyTable");

    data.forEach(item=>{
        let row = table.insertRow();
        row.insertCell(0).innerText = item.date;
        row.insertCell(1).innerText = item.food;
        row.insertCell(2).innerText = item.calories + " kcal";
    });

    new Chart(document.getElementById('lineChart'),{
        type:'line',
        data:{
            labels:labels,
            datasets:[{
                label:'Calories',
                data:calories,
                borderWidth:3,
                tension:0.4
            }]
        }
    });

    new Chart(document.getElementById('pieChart'),{
        type:'pie',
        data:{
            labels:labels,
            datasets:[{
                data:calories
            }]
        }
    });

});
</script>

</body>
</html>
